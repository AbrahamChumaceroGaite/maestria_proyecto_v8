version: '3.8'

services:
  mysql:
    build:
      context: ./services/mysql
      dockerfile: Dockerfile
    image: wordpress-mysql:1.0.0
    container_name: wp-mysql
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build:
      context: ./services/wordpress
      dockerfile: Dockerfile
    image: wordpress-app:1.0.0
    container_name: wp-app
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - frontend
      - backend
    ports:
      - "80:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  phpmyadmin:
    build:
      context: ./services/phpmyadmin
      dockerfile: Dockerfile
    image: wordpress-phpmyadmin:1.0.0
    container_name: wp-phpmyadmin
    env_file: .env
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - frontend
      - backend
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  uptime-kuma:
    build:
      context: ./services/uptime-kuma
      dockerfile: Dockerfile
    image: wordpress-uptime:1.0.0
    container_name: wp-uptime
    volumes:
      - uptime-data:/app/data
    networks:
      - frontend
    ports:
      - "3001:3001"
    restart: unless-stopped

  mailhog:
    build:
      context: ./services/mailhog
      dockerfile: Dockerfile
    image: wordpress-mailhog:1.0.0
    container_name: wp-mailhog
    networks:
      - backend
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  wp-cli:
    build:
      context: ./services/wp-cli
      dockerfile: Dockerfile
    image: wordpress-cli:1.0.0
    container_name: wp-cli
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_URL: ${WORDPRESS_URL}
      WORDPRESS_TITLE: ${WORDPRESS_TITLE}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
    volumes:
      - wordpress-data:/var/www/html
      - ./scripts:/scripts:ro
    networks:
      - backend
    depends_on:
      wordpress:
        condition: service_started
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/wp-init.sh"]
    restart: "no"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  wordpress-data:
    driver: local
  uptime-data:
    driver: local