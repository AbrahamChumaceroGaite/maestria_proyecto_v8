version: '3.8'

services:
  mysql:
    image: ${DOCKER_USERNAME}/wordpress-mysql:${IMAGE_TAG}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    secrets:
      - source: credentials
        target: /run/secrets/app.env
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pchangeme_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: >
      bash -c '
      export $$(grep -v "^#" /run/secrets/app.env | xargs);
      /usr/local/bin/docker-entrypoint.sh mysqld
      '

  wordpress:
    image: ${DOCKER_USERNAME}/wordpress-app:${IMAGE_TAG}
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    secrets:
      - source: credentials
        target: /run/secrets/app.env
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
      - source: php_config
        target: /usr/local/etc/php/conf.d/custom.ini
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - frontend
      - backend
    ports:
      - "80:80"

  phpmyadmin:
    image: ${DOCKER_USERNAME}/wordpress-phpmyadmin:${IMAGE_TAG}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    secrets:
      - source: credentials
        target: /run/secrets/app.env
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: wpuser
    networks:
      - frontend
      - backend
    ports:
      - "8080:80"

  uptime-kuma:
    image: ${DOCKER_USERNAME}/wordpress-uptime:${IMAGE_TAG}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    volumes:
      - uptime-data:/app/data
    networks:
      - frontend
    ports:
      - "3001:3001"

  mailhog:
    image: ${DOCKER_USERNAME}/wordpress-mailhog:${IMAGE_TAG}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - backend
    ports:
      - "1025:1025"
      - "8025:8025"

  wp-cli:
    image: ${DOCKER_USERNAME}/wordpress-cli:${IMAGE_TAG}
    deploy:
      replicas: 1
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.role == manager
    secrets:
      - source: credentials
        target: /run/secrets/app.env
    volumes:
      - wordpress-data:/var/www/html
      - type: bind
        source: ./scripts
        target: /scripts
        read_only: true
    networks:
      - backend
    entrypoint: ["/bin/bash", "/scripts/wp-init.sh"]

networks:
  frontend:
    driver: overlay
    attachable: true
  backend:
    driver: overlay

volumes:
  mysql-data:
    driver: local
  wordpress-data:
    driver: local
  uptime-data:
    driver: local

secrets:
  credentials:
    file: ./secrets.env

configs:
  nginx_config:
    file: ./services/wordpress/nginx.conf
  php_config:
    file: ./services/wordpress/php.ini

