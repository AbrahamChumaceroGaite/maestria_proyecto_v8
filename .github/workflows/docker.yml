name: Docker Swarm Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build images
      run: |
        cd _DOCKER/scripts
        chmod +x *.sh
        ./build-images.sh
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        IMAGE_TAG: latest
    
    - name: Push images
      run: |
        cd _DOCKER/scripts
        ./push-images.sh
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        IMAGE_TAG: latest
    
    - name: Init Swarm
      run: docker swarm init
    
    - name: Deploy Stack
      run: |
        cd _DOCKER/scripts
        ./stack-deploy.sh
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        IMAGE_TAG: latest
        STACK_NAME: wordpress
    
    - name: Check Services
      run: docker stack services wordpress
    
    - name: Check Stack
      run: docker stack ps wordpress
    
    - name: Remove Stack
      if: always()
      run: |
        cd _DOCKER/scripts
        ./stack-remove.sh
      env:
        STACK_NAME: wordpress
