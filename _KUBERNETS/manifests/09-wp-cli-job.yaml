apiVersion: batch/v1
kind: Job
metadata:
  name: wp-cli-init
  namespace: wordpress
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: wp-cli
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-wordpress
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z wordpress-service 80; do
            sleep 5
          done
          sleep 30
      containers:
      - name: wp-cli
        image: wordpress-cli:1.0.0
        imagePullPolicy: IfNotPresent
        env:
        - name: WORDPRESS_DB_HOST
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_DB_HOST
        - name: WORDPRESS_DB_NAME
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_DB_NAME
        - name: WORDPRESS_DB_USER
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_DB_USER
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_DB_PASSWORD
        - name: WORDPRESS_TABLE_PREFIX
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_TABLE_PREFIX
        - name: WORDPRESS_URL
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_URL
        - name: WORDPRESS_TITLE
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_TITLE
        - name: WORDPRESS_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_ADMIN_USER
        - name: WORDPRESS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_ADMIN_PASSWORD
        - name: WORDPRESS_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: wordpress-secret
              key: WORDPRESS_ADMIN_EMAIL
        volumeMounts:
        - name: wordpress-storage
          mountPath: /var/www/html
        - name: wp-init-script
          mountPath: /scripts
        command:
        - /bin/bash
        - /scripts/wp-init.sh
      volumes:
      - name: wordpress-storage
        persistentVolumeClaim:
          claimName: wordpress-pvc
      - name: wp-init-script
        configMap:
          name: wp-init-script
          defaultMode: 0755

