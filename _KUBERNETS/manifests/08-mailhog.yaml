apiVersion: v1
kind: Service
metadata:
  name: mailhog-service
  namespace: wordpress
spec:
  type: LoadBalancer
  ports:
    - port: 8025
      targetPort: 8025
      protocol: TCP
      name: web
    - port: 1025
      targetPort: 1025
      protocol: TCP
      name: smtp
  selector:
    app: mailhog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
      - name: mailhog
        image: wordpress-mailhog:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8025
          name: web
        - containerPort: 1025
          name: smtp
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 8025
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8025
          initialDelaySeconds: 5
          periodSeconds: 5

