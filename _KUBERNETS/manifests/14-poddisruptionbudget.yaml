apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wordpress-pdb
  namespace: wordpress
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: wordpress
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: phpmyadmin-pdb
  namespace: wordpress
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: phpmyadmin

